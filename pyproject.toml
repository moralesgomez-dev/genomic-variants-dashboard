[project]
name = "genomic_variants_dashboard"
version = "0.1.0"
description = "Chromosome 22 variant processing and exploratory analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "seaborn>=0.13",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/variantes_genomicas"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/variantes_genomicas/EDA.py" = ["E501", "W191"]

[tool.pytest.ini_options]
pythonpath = ["src"]
